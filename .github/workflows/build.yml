name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test core
        run: cd apps && cargo test -p eos-core --release
      - name: Build universal app bundles
        run: apps/bundle_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: apps/dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cd apps; cargo build --release -p eos-flasher -p eos-pantest
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/dist | Out-Null
          Compress-Archive -Path apps/target/release/eos-flasher.exe -DestinationPath apps/dist/EOS-Flasher-Windows.zip
          Compress-Archive -Path apps/target/release/eos-pantest.exe -DestinationPath apps/dist/EOS-PanTest-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          prerelease: true
